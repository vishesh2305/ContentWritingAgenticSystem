# Local infrastructure for the content pipeline (Plan.md Step 0).
# The api/worker services are added in Step 11; Langfuse in Step 12.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: content
      POSTGRES_PASSWORD: content
      POSTGRES_DB: content
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content -d content"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  languagetool:
    # TODO(Step 7): pin to a specific version tag once the grammar client is built against it.
    image: erikvl87/languagetool:latest
    ports:
      - "8010:8010"
    environment:
      Java_Xms: 512m
      Java_Xmx: 1g

volumes:
  postgres-data:
